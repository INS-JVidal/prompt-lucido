  <circle cx="315" cy="289.2" r="6" fill="none" stroke="#6B6B63" stroke-width="0.96" opacity="0.5"/>
  <circle cx="315" cy="289.2" r="4" fill="#C4704A" opacity="0.85"/>
  <circle cx="315" cy="343.2" r="6" fill="none" stroke="#6B6B63" stroke-width="0.96" opacity="0.5"/>
  <circle cx="315" cy="343.2" r="4" fill="#C4704A" opacity="0.85"/>

  <!-- Each finding traced back to a line of code -->
  <line x1="180" y1="333" x2="270" y2="328.8" stroke="#C4704A" stroke-width="0.8" opacity="0.3" stroke-linecap="round" stroke-dasharray="3 5"/>
  <line x1="162" y1="276" x2="270" y2="276" stroke="#C4704A" stroke-width="0.8" opacity="0.25" stroke-linecap="round" stroke-dasharray="3 5"/>
  <line x1="447" y1="345" x2="360" y2="342" stroke="#6B6B63" stroke-width="0.8" opacity="0.3" stroke-linecap="round" stroke-dasharray="3 5"/>
  <line x1="465" y1="282" x2="354" y2="289.2" stroke="#6B6B63" stroke-width="0.8" opacity="0.25" stroke-linecap="round" stroke-dasharray="3 5"/>

