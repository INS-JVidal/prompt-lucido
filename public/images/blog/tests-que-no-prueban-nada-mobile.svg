<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 630">

  <defs>

    <!-- Warm gradient background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF9F6"/>
      <stop offset="100%" stop-color="#F0EFEA"/>
    </linearGradient>

    <radialGradient id="glow0" cx="0.5" cy="0.3" r="0.4">
      <stop offset="0%" stop-color="#C4704A" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#C4704A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow1" cx="0.5" cy="0.55" r="0.35">
      <stop offset="0%" stop-color="#C4704A" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#C4704A" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- Background -->
  <rect width="630" height="630" fill="url(#bg)"/>
  <rect width="630" height="630" fill="url(#glow0)"/>
  <rect width="630" height="630" fill="url(#glow1)"/>


  <!-- Ambient texture: faint scattered strokes -->
  <line x1="332.4" y1="153.1" x2="359.1" y2="169.6" stroke="#6B6B63" stroke-width="1.4" opacity="0.2" stroke-linecap="round"/>
  <line x1="586.4" y1="581.2" x2="608.6" y2="596" stroke="#E0DFDA" stroke-width="1.4" opacity="0.4" stroke-linecap="round"/>
  <line x1="69.4" y1="104.5" x2="102.9" y2="103.3" stroke="#E0DFDA" stroke-width="1.6" opacity="0.29" stroke-linecap="round"/>
  <line x1="312.6" y1="548.2" x2="345.6" y2="552.2" stroke="#E0DFDA" stroke-width="1.2" opacity="0.3" stroke-linecap="round"/>
  <line x1="227.4" y1="515.3" x2="259.7" y2="500.4" stroke="#E0DFDA" stroke-width="1.7" opacity="0.27" stroke-linecap="round"/>
  <line x1="204.6" y1="524.6" x2="237.5" y2="546.4" stroke="#E0DFDA" stroke-width="1.6" opacity="0.39" stroke-linecap="round"/>
  <line x1="30.7" y1="505.9" x2="79.1" y2="524.1" stroke="#E0DFDA" stroke-width="1.6" opacity="0.31" stroke-linecap="round"/>
  <line x1="578.5" y1="66.6" x2="634.8" y2="52.4" stroke="#E0DFDA" stroke-width="1" opacity="0.33" stroke-linecap="round"/>
  <line x1="456.2" y1="156.8" x2="501.7" y2="171.5" stroke="#E0DFDA" stroke-width="1" opacity="0.32" stroke-linecap="round"/>
  <line x1="553" y1="563.6" x2="594.6" y2="589.2" stroke="#E0DFDA" stroke-width="1.4" opacity="0.33" stroke-linecap="round"/>
  <line x1="558.8" y1="56.7" x2="597.6" y2="82.6" stroke="#6B6B63" stroke-width="1.7" opacity="0.18" stroke-linecap="round"/>
  <line x1="379.1" y1="129.6" x2="402.4" y2="118.5" stroke="#E0DFDA" stroke-width="1.5" opacity="0.27" stroke-linecap="round"/>
  <line x1="208.7" y1="98.6" x2="242" y2="95.7" stroke="#6B6B63" stroke-width="1.2" opacity="0.21" stroke-linecap="round"/>
  <line x1="534.8" y1="142" x2="579.2" y2="139" stroke="#E0DFDA" stroke-width="1.2" opacity="0.31" stroke-linecap="round"/>
  <line x1="573.7" y1="142.9" x2="611.8" y2="156.3" stroke="#E0DFDA" stroke-width="1.2" opacity="0.26" stroke-linecap="round"/>
  <line x1="365.5" y1="579.7" x2="403.6" y2="584.9" stroke="#E0DFDA" stroke-width="1.2" opacity="0.31" stroke-linecap="round"/>
  <line x1="559.4" y1="161.3" x2="601.5" y2="175.7" stroke="#E0DFDA" stroke-width="1.1" opacity="0.31" stroke-linecap="round"/>
  <line x1="352.2" y1="498.8" x2="388" y2="474.8" stroke="#E0DFDA" stroke-width="1.7" opacity="0.38" stroke-linecap="round"/>
  <circle cx="167.8" cy="159" r="2.4" fill="#6B6B63" opacity="0.16"/>
  <circle cx="408.2" cy="214.9" r="2.5" fill="#6B6B63" opacity="0.15"/>
  <circle cx="335.9" cy="94.1" r="2.1" fill="#6B6B63" opacity="0.22"/>
  <circle cx="199.5" cy="478.5" r="2.3" fill="#6B6B63" opacity="0.21"/>
  <circle cx="286.8" cy="262.9" r="2.4" fill="#6B6B63" opacity="0.13"/>
  <circle cx="454.8" cy="302.3" r="1.5" fill="#6B6B63" opacity="0.21"/>

  <!-- Tautological loop: the tests are derived from the code they check -->
  <circle cx="213" cy="315" r="63" fill="#6B6B63" fill-opacity="0.035" stroke="#6B6B63" stroke-width="0.8" opacity="0.12"/>
  <path d="M153.8 293.5 A63 63 0 0 1 270.1 288.4" fill="none" stroke="#6B6B63" stroke-width="1.44" opacity="0.45" stroke-linecap="round"/>
  <path d="M272.2 336.5 A63 63 0 0 1 155.9 341.6" fill="none" stroke="#6B6B63" stroke-width="1.44" opacity="0.45" stroke-linecap="round"/>
  <path d="M265.7 285.3 L270.1 288.4 L270.6 283" fill="none" stroke="#6B6B63" stroke-width="1.28" opacity="0.55" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M160.3 344.7 L155.9 341.6 L155.4 347" fill="none" stroke="#6B6B63" stroke-width="1.28" opacity="0.55" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Code (top) and test (bottom): always agree, always green -->
  <rect x="193.8" y="238.8" width="38.4" height="26.4" rx="4.8" fill="#FFFFFF" fill-opacity="0.6" stroke="#6B6B63" stroke-width="0.96" opacity="0.4"/>
  <line x1="201" y1="246" x2="222.6" y2="246" stroke="#6B6B63" stroke-width="1.28" opacity="0.35" stroke-linecap="round"/>
  <line x1="201" y1="252" x2="216.6" y2="252" stroke="#6B6B63" stroke-width="1.28" opacity="0.35" stroke-linecap="round"/>
  <line x1="201" y1="258" x2="225" y2="258" stroke="#6B6B63" stroke-width="1.28" opacity="0.35" stroke-linecap="round"/>
  <circle cx="213" cy="378" r="10.8" fill="#FFFFFF" fill-opacity="0.6" stroke="#6B6B63" stroke-width="0.96" opacity="0.45"/>
  <path d="M208.8 378 L211.8 381 L217.8 374.4" fill="none" stroke="#6B6B63" stroke-width="1.44" opacity="0.55" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The watchman watching itself: an eye-like centre that only sees the loop -->
  <circle cx="213" cy="315" r="13.2" fill="none" stroke="#6B6B63" stroke-width="0.8" opacity="0.3"/>
  <circle cx="213" cy="315" r="4.8" fill="#6B6B63" opacity="0.4"/>

  <!-- Source of truth: the requirement, outside the code -->
  <circle cx="465" cy="315" r="42" fill="none" stroke="#C4704A" stroke-width="0.8" opacity="0.12"/>
  <circle cx="465" cy="315" r="28.8" fill="none" stroke="#C4704A" stroke-width="0.8" opacity="0.2"/>
  <circle cx="465" cy="315" r="16.8" fill="none" stroke="#C4704A" stroke-width="0.8" opacity="0.35"/>
  <circle cx="465" cy="315" r="8" fill="#C4704A" opacity="0.85"/>

  <!-- Checking from outside: the only line that can fail -->
  <line x1="447" y1="315" x2="231" y2="315" stroke="#C4704A" stroke-width="1.12" opacity="0.5" stroke-linecap="round" stroke-dasharray="5 6"/>
  <path d="M236.9 312.3 L232.2 315 L236.9 317.7" fill="none" stroke="#C4704A" stroke-width="1.28" opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="505.3" y1="286.8" x2="519.1" y2="277.1" stroke="#C4704A" stroke-width="0.8" opacity="0.25" stroke-linecap="round"/>
  <line x1="505.3" y1="343.2" x2="519.1" y2="352.9" stroke="#C4704A" stroke-width="0.8" opacity="0.25" stroke-linecap="round"/>
  <line x1="422.4" y1="339.6" x2="407.8" y2="348" stroke="#C4704A" stroke-width="0.8" opacity="0.25" stroke-linecap="round"/>
  <line x1="422.4" y1="290.4" x2="407.8" y2="282" stroke="#C4704A" stroke-width="0.8" opacity="0.25" stroke-linecap="round"/>

</svg>
