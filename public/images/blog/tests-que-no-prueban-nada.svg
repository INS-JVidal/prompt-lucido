  <path d="M423 420 L428 425 L438 414" fill="none" stroke="#6B6B63" stroke-width="1.8" opacity="0.55" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The watchman watching itself: an eye-like centre that only sees the loop -->
  <circle cx="430" cy="315" r="22" fill="none" stroke="#6B6B63" stroke-width="1" opacity="0.3"/>
  <circle cx="430" cy="315" r="6" fill="#6B6B63" opacity="0.4"/>

  <!-- Source of truth: the requirement, outside the code -->
  <circle cx="850" cy="315" r="70" fill="none" stroke="#C4704A" stroke-width="1" opacity="0.12"/>
  <circle cx="850" cy="315" r="48" fill="none" stroke="#C4704A" stroke-width="1" opacity="0.2"/>
  <circle cx="850" cy="315" r="28" fill="none" stroke="#C4704A" stroke-width="1" opacity="0.35"/>
  <circle cx="850" cy="315" r="10" fill="#C4704A" opacity="0.85"/>

  <!-- Checking from outside: the only line that can fail -->
  <line x1="820" y1="315" x2="460" y2="315" stroke="#C4704A" stroke-width="1.4" opacity="0.5" stroke-linecap="round" stroke-dasharray="5 6"/>
