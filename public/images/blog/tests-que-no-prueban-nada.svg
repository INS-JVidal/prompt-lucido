  <!-- Code (top) and test (bottom): always agree, always green -->
  <rect x="398" y="188" width="64" height="44" rx="8" fill="#FFFFFF" fill-opacity="0.6" stroke="#6B6B63" stroke-width="1.2" opacity="0.4"/>
  <line x1="410" y1="200" x2="446" y2="200" stroke="#6B6B63" stroke-width="1.6" opacity="0.35" stroke-linecap="round"/>
